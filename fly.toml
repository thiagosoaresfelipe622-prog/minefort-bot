# fly.toml configuração para rodar 24/7 com SSHX e bom desempenho

app = 'minefort-bot-n0mgea'
primary_region = 'gru'

[build]

# Removido o bloco [http_service] — não é necessário para SSHX.
# Isso impede que o Fly desligue a máquina por falta de tráfego HTTP.

[[vm]]
  cpu_kind = 'shared'
  cpus = 2          # 2 CPUs compartilhadas = boa performance sem custo elevado
  memory = '2gb'    # 2 GB de RAM (limite permitido para shared)
